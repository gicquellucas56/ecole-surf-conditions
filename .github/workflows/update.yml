name: Mise à jour des conditions

on:
  schedule:
    - cron: "23 * * * *"   # toutes les heures, à h+23 (évite les pics de charge des API)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: conditions
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Générer conditions.json
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUS_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUS_PASSWORD }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      # GitHub désactive les tâches planifiées après 60 jours sans commit :
      # un petit commit automatique le 1er de chaque mois garde le robot actif.
      - name: Keepalive mensuel
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d%H)" = "0100" ]; then
            date -u > .keepalive
            git config user.name "conditions-bot"
            git config user.email "conditions-bot@users.noreply.github.com"
            git add .keepalive && git commit -m "keepalive" && git push
          fi
